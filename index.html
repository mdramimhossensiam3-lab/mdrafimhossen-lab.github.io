<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic AI Photo Studio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 {
            font-size: 2.2rem;
            color: #38bdf8;
            margin-bottom: 8px;
        }
        header p {
            color: #94a3b8;
            font-size: 1rem;
        }
        .container {
            background: #1e293b;
            width: 100%;
            max-width: 900px;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
        .input-section, .output-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        label {
            font-weight: 600;
            font-size: 0.9rem;
            color: #cbd5e1;
        }
        textarea, select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        input[type="file"] {
            display: none;
        }
        .upload-btn {
            background: #334155;
            color: #e2e8f0;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            border: 1px dashed #64748b;
            transition: 0.3s;
        }
        .upload-btn:hover {
            background: #475569;
        }
        .btn-submit {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-submit:hover {
            opacity: 0.9;
        }
        .preview-box {
            width: 100%;
            height: 260px;
            background: #0f172a;
            border-radius: 8px;
            border: 1px solid #334155;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        .preview-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .placeholder-text {
            color: #64748b;
            font-size: 0.9rem;
        }
        .btn-download {
            background: #16a34a;
            color: white;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            text-align: center;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>AI Realistic Photo Studio</h1>
        <p>বাস্তবসম্মত প্রফেশনাল AI ছবি তৈরি করুন</p>
    </header>

    <div class="container">
        <!-- Input Section -->
        <div class="input-section">
            <div class="form-group">
                <label>আপনার মূল ছবি আপলোড করুন:</label>
                <label for="fileUpload" class="upload-btn" id="uploadLabel">📷 ছবি নির্বাচন করুন</label>
                <input type="file" id="fileUpload" accept="image/*" onchange="previewSourceImage(event)">
            </div>

            <div class="form-group">
                <label>ছবি স্টাইল (Style):</label>
                <select id="styleSelect">
                    <option value="photorealistic portrait, DSLR camera shot, 85mm lens, natural lighting, sharp focus, highly detailed skin texture, real life photography">📸 প্রফেশনাল রিয়েলিস্টিক ছবি (DSLR Look)</option>
                    <option value="cinematic photography, soft natural daylight, shallow depth of field, masterpiece portrait">🎬 সিনেমাটিক পোর্ট্রেট (Cinematic)</option>
                    <option value="cyberpunk style, neon lights, futuristic fashion">🌆 সাইবারপাঙ্ক (Cyberpunk)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="prompt">অতিরিক্ত তথ্য (English Prompt):</label>
                <textarea id="prompt" placeholder="Example: A young Bangladeshi man in a blue blazer, outdoor university campus background..."></textarea>
            </div>

            <button class="btn-submit" onclick="generateAIImage()">✨ AI ছবি জেনারেট করুন</button>
        </div>

        <!-- Output Section -->
        <div class="output-section">
            <label>আপলোড করা ছবি:</label>
            <div class="preview-box">
                <span class="placeholder-text" id="srcPlaceholder">কোনো ছবি আপলোড করা হয়নি</span>
                <img id="sourcePreview" style="display:none;">
            </div>

            <label>AI দ্বারা তৈরি নতুন ছবি:</label>
            <div class="preview-box">
                <span class="placeholder-text" id="resultPlaceholder">জেনারেট করা ছবি এখানে দেখাবে</span>
                <img id="resultImage" style="display:none;">
            </div>

            <a id="downloadBtn" class="btn-download" target="_blank" download="ai-generated-image.jpg">📥 ছবি ডাউনলোড করুন</a>
        </div>
    </div>

    <script>
        function previewSourceImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById('sourcePreview');
                    img.src = e.target.result;
                    img.style.display = 'block';
                    document.getElementById('srcPlaceholder').style.display = 'none';
                    document.getElementById('uploadLabel').innerText = "✓ " + file.name;
                }
                reader.readAsDataURL(file);
            }
        }

        function generateAIImage() {
            const style = document.getElementById('styleSelect').value;
            const promptText = document.getElementById('prompt').value.trim();
            const resultImg = document.getElementById('resultImage');
            const resultPlaceholder = document.getElementById('resultPlaceholder');
            const downloadBtn = document.getElementById('downloadBtn');

            if (!promptText) {
                alert("দয়া করে ছবি সম্পর্কে বিবরণ (English Prompt) লিখুন!");
                return;
            }

            const fullPrompt = `${promptText}, ${style}`;

            resultPlaceholder.style.display = 'block';
            resultPlaceholder.innerText = "রিয়েলিস্টিক AI ছবি তৈরি হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...";
            resultImg.style.display = 'none';
            downloadBtn.style.display = 'none';

            const seed = Math.floor(Math.random() * 100000);
            const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(fullPrompt)}?seed=${seed}&width=1024&height=1024&nologo=true&model=flux`;

            const tempImg = new Image();
            tempImg.onload = function() {
                resultImg.src = imageUrl;
                resultImg.style.display = 'block';
                resultPlaceholder.style.display = 'none';

                downloadBtn.href = imageUrl;
                downloadBtn.style.display = 'block';
            };
            tempImg.onerror = function() {
                resultPlaceholder.innerText = "ছবি তৈরি করতে সমস্যা হয়েছে, আবার চেষ্টা করুন।";
            };
            tempImg.src = imageUrl;
        }
    </script>
</body>
</html>
