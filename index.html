<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rafim - User & NID Verification Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #090a16;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background: rgba(16, 18, 38, 0.95);
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 223, 216, 0.2);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .brand {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(45deg, #00dfd8, #0072ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .tagline {
            color: #8a8fae;
            font-size: 13px;
        }
        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }
        .card {
            background: #111325;
            border: 1px solid rgba(0, 223, 216, 0.2);
            width: 100%;
            max-width: 500px;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }
        .card h2 {
            font-size: 22px;
            color: #00dfd8;
            margin-bottom: 8px;
            text-align: center;
        }
        .card p {
            color: #9aa0c0;
            font-size: 14px;
            text-align: center;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #d1d5db;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: #090a16;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }
        .form-group input:focus {
            border-color: #00dfd8;
            box-shadow: 0 0 10px rgba(0, 223, 216, 0.2);
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #00dfd8, #0072ff);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-submit:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        .status-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            font-size: 14px;
            text-align: center;
        }
        .status-box.success {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid #00ff88;
            color: #00ff88;
        }
        .status-box.error {
            background: rgba(255, 0, 85, 0.1);
            border: 1px solid #ff0055;
            color: #ff0055;
        }
        footer {
            text-align: center;
            padding: 20px;
            font-size: 13px;
            color: #6b7280;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>

    <header>
        <div>
            <div class="brand">Rafim Systems</div>
            <div class="tagline">Identity & User Verification Portal</div>
        </div>
    </header>

    <div class="main-container">
        <div class="card">
            <h2>NID & User Verification</h2>
            <p>আপনার ১০/১৭ ডিজিটের NID নম্বর ও ফোন নম্বর দিয়ে ভেরিফিকেশন সম্পন্ন করুন</p>

            <form id="verifyForm">
                <div class="form-group">
                    <label>পূর্ণ নাম (Full Name)</label>
                    <input type="text" id="fullName" placeholder="যেমন: Rafim Hossen" required>
                </div>

                <div class="form-group">
                    <label>মোবাইল নম্বর (Phone Number)</label>
                    <input type="tel" id="phone" placeholder="017XXXXXXXX" required>
                </div>

                <div class="form-group">
                    <label>এনআইডি নম্বর (NID Number)</label>
                    <input type="text" id="nid" placeholder="১০ বা ১৭ ডিজিটের NID লিখুন" required>
                </div>

                <button type="submit" class="btn-submit">Submit Verification</button>
            </form>

            <div id="statusBox" class="status-box"></div>
        </div>
    </div>

    <footer>
        &copy; 2026 Rafim Systems. All Rights Reserved. Secure Identity Verification Service.
    </footer>

    <script>
        document.getElementById('verifyForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('fullName').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const nid = document.getElementById('nid').value.trim();
            const statusBox = document.getElementById('statusBox');

            statusBox.style.display = 'block';

            // Phone Validation
            const phoneRegex = /^01[3-9]\d{8}$/;
            if (!phoneRegex.test(phone)) {
                statusBox.className = 'status-box error';
                statusBox.innerText = '⚠️ সঠিক ১১ ডিজিটের মোবাইল নম্বর দিন (যেমন: 017XXXXXXXX)';
                return;
            }

            // NID Validation (10 or 17 digits)
            if (nid.length !== 10 && nid.length !== 17) {
                statusBox.className = 'status-box error';
                statusBox.innerText = '⚠️ NID নম্বর অবশ্যই ১০ অথবা ১৭ ডিজিটের হতে হবে।';
                return;
            }

            // Success Response Simulation
            statusBox.className = 'status-box success';
            statusBox.innerText = `✅ ধন্যবাদ ${name}! আপনার NID (${nid}) ভেরিফিকেশন রিকোয়েস্ট সফলভাবে জমা হয়েছে।`;
            
            // Clear inputs
            document.getElementById('verifyForm').reset();
        });
    </script>
</body>
</html>
