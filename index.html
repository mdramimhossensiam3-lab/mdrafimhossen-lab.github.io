<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rafim Live TV & Sports Hub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #080915; color: #fff; min-height: 100vh; display: flex; flex-direction: column; }
        
        header {
            background: #101224;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 223, 216, 0.2);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .brand { font-size: 22px; font-weight: 800; color: #00dfd8; }
        .live-badge { background: #ff0055; color: #fff; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }

        .container { max-width: 900px; margin: 30px auto; padding: 0 20px; width: 100%; }
        
        /* Video Player Box */
        .player-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #00dfd8;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            margin-bottom: 30px;
        }
        .player-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .section-title { margin: 20px 0 15px 0; color: #00dfd8; font-size: 18px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        
        .channel-card {
            background: #12142a;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            color: #fff;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .channel-card:hover {
            background: rgba(0, 223, 216, 0.15);
            border-color: #00dfd8;
        }
        .channel-card span { font-size: 15px; font-weight: 600; }
        .status-live { color: #ff0055; font-size: 11px; font-weight: bold; }

        footer { text-align: center; padding: 25px; font-size: 13px; color: #6b7280; border-top: 1px solid rgba(255,255,255,0.05); margin-top: auto; }
    </style>
</head>
<body>

    <header>
        <div class="brand">Rafim Live Hub 📺</div>
        <div class="live-badge">🔴 SITE PLAYER</div>
    </header>

    <div class="container">
        <!-- Direct Video Player Screen -->
        <div class="player-container">
            <iframe id="mainPlayer" src="https://www.youtube.com/embed/i8VSQO6TlFc" allowfullscreen allow="autoplay"></iframe>
        </div>

        <!-- Channels Grid -->
        <div class="section-title">📰 চ্যানেল লিস্ট (ক্লিক করলে এখানেই চলবে)</div>
        <div class="grid">
            <div class="channel-card" onclick="playVideo('i8VSQO6TlFc')">
                <span>📺 সময় টিভি (Somoy TV)</span>
                <span class="status-live">● PLAY HERE</span>
            </div>
            <div class="channel-card" onclick="playVideo('L3w72SqX4ng')">
                <span>📺 অন্য ভিডিও বা নিউজ</span>
                <span class="status-live">● PLAY HERE</span>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 Rafim Live Hub. All Rights Reserved.
    </footer>

    <script>
        function playVideo(videoId) {
            const iframe = document.getElementById('mainPlayer');
            iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
        }
    </script>
</body>
</html>
