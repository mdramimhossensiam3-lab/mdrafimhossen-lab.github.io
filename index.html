<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rafim Live TV & Sports</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #090a16;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: rgba(16, 18, 38, 0.95);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 223, 216, 0.2);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .brand {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(45deg, #00dfd8, #0072ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .live-badge {
            background: #ff0055;
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            animation: blink 1.5s infinite;
        }
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
        .container {
            max-width: 1100px;
            margin: 20px auto;
            padding: 0 15px;
            width: 100%;
        }
        
        /* Video Player Area */
        .player-box {
            background: #000;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(0, 223, 216, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
        }
        .player-box iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Channel Selection Grid */
        .section-title {
            margin: 25px 0 15px 0;
            font-size: 18px;
            color: #00dfd8;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
        }
        .btn-channel {
            background: #111325;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #fff;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .btn-channel:hover {
            background: rgba(0, 223, 216, 0.15);
            border-color: #00dfd8;
            transform: translateY(-2px);
        }
        .btn-channel.active {
            background: linear-gradient(135deg, #00dfd8, #0072ff);
            border-color: transparent;
            font-weight: bold;
        }
        footer {
            margin-top: auto;
            text-align: center;
            padding: 20px;
            font-size: 13px;
            color: #6b7280;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">Rafim Live Sports & TV Hub</div>
        <div class="live-badge">🔴 LIVE STREAM</div>
    </header>

    <div class="container">
        <!-- Main Video Screen -->
        <div class="player-box">
            <iframe id="mainPlayer" src="https://www.youtube.com/embed/live_stream?channel=UCbv1G1zY7N2XU02M-EaRkKw" allowfullscreen allow="autoplay"></iframe>
        </div>

        <!-- Sports Channels -->
        <div class="section-title">⚽ Sports Live Channels (লাইভ খেলা)</div>
        <div class="grid">
            <button class="btn-channel active" onclick="playChannel('https://www.youtube.com/embed/live_stream?channel=UCbv1G1zY7N2XU02M-EaRkKw', this)">
                ⚽ T Sports Live
            </button>
            <button class="btn-channel" onclick="playChannel('https://www.youtube.com/embed/live_stream?channel=UCc9wZ69k5kQ0z2p-8H5l0wQ', this)">
                🏏 GTV Live
            </button>
            <button class="btn-channel" onclick="playChannel('https://www.youtube.com/embed/live_stream?channel=UC_X-F-x79Ww9_N15h6N98Yg', this)">
                🏆 Star Sports Live
            </button>
            <button class="btn-channel" onclick="playChannel('https://www.youtube.com/embed/live_stream?channel=UC-0s9W2lM2N_6a2p5-b-0gQ', this)">
                ⚽ Live Football Stream
            </button>
        </div>

        <!-- BD News Channels -->
        <div class="section-title">📰 Bangladesh News Channels (লাইভ খবর)</div>
        <div class="grid">
            <button class="btn-channel" onclick="playChannel('https://www.youtube.com/embed/live_stream?channel=UC8V_pQvW2lKk3Ew6c2Z1Ftw', this)">
                📺 Somoy News Live
            </button>
            <button class="btn-channel" onclick="playChannel('https://www.youtube.com/embed/live_stream?channel=UC6kLqR3t37mQ1Z-QY3Z9wYg', this)">
                📺 Jamuna TV Live
            </button>
            <button class="btn-channel" onclick="playChannel('https://www.youtube.com/embed/live_stream?channel=UCB2uJkR434eR4K00J059w3w', this)">
                📺 Independent TV
            </button>
            <button class="btn-channel" onclick="playChannel('https://www.youtube.com/embed/live_stream?channel=UCn89S2r92Q23Vv_0Q9k0M0w', this)">
                📺 DBC News Live
            </button>
            <button class="btn-channel" onclick="playChannel('https://www.youtube.com/embed/live_stream?channel=UCuG812y2P8m9X6mK4lJg2Ew', this)">
                📺 Channel 24 Live
            </button>
            <button class="btn-channel" onclick="playChannel('https://www.youtube.com/embed/live_stream?channel=UC-K5h8F2e4_X-L-0182_9Qw', this)">
                📺 Ekattor TV Live
            </button>
        </div>
    </div>

    <footer>
        &copy; 2026 Rafim Live Hub. All Streamed Content Belongs to Respective Network Providers.
    </footer>

    <script>
        function playChannel(url, element) {
            document.getElementById('mainPlayer').src = url;
            
            // Active Button Highlight
            document.querySelectorAll('.btn-channel').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
        }
    </script>
</body>
</html>
