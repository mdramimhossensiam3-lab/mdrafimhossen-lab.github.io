<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Highway Car Racer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            overflow: hidden;
            background: #000;
            color: #fff;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 204, 0.3);
            backdrop-filter: blur(5px);
        }
        .ui-overlay h1 {
            font-size: 20px;
            color: #00ffcc;
            margin-bottom: 5px;
        }
        .ui-overlay p {
            font-size: 16px;
            color: #fff;
        }
        .controls-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            color: #aaa;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        #game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            background: rgba(15, 15, 25, 0.95);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            border: 2px solid #ff0055;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.5);
        }
        #game-over h2 {
            font-size: 36px;
            color: #ff0055;
            margin-bottom: 10px;
        }
        #game-over p {
            font-size: 18px;
            margin-bottom: 20px;
        }
        .btn-restart {
            background: linear-gradient(45deg, #ff0055, #00ffcc);
            border: none;
            color: #000;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-restart:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px #00ffcc;
        }
    </style>
    <!-- Three.js 3D Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div class="ui-overlay">
        <h1>3D Highway Racer</h1>
        <p>Speed: <span id="speed-val" style="color:#00ffcc; font-weight:bold;">0</span> km/h</p>
        <p>Score: <span id="score-val" style="color:#ff0055; font-weight:bold;">0</span></p>
    </div>

    <div class="controls-hint">
        🎮 <b>Controls:</b> Left / Right Arrows (Steer), Up Arrow (Accelerate), Down Arrow (Brake)
    </div>

    <div id="game-over">
        <h2>CRASHED!</h2>
        <p>Your Final Score: <span id="final-score">0</span></p>
        <button class="btn-restart" onclick="resetGame()">Play Again</button>
    </div>

    <div id="game-container"></div>

    <script>
        let scene, camera, renderer;
        let playerCar, road, enemyCars = [];
        let speed = 0, maxSpeed = 1.5, acceleration = 0.015, deceleration = 0.01;
        let score = 0, isGameOver = false;

        let keys = { ArrowLeft: false, ArrowRight: false, ArrowUp: false, ArrowDown: false };

        function init() {
            const container = document.getElementById('game-container');

            // 1. Scene & Camera
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b0d19);
            scene.fog = new THREE.FogExp2(0x0b0d19, 0.015);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3, 7);
            camera.lookAt(0, 1, -5);

            // 2. Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // 3. Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // 4. Create Road
            const roadGeo = new THREE.PlaneGeometry(12, 1000);
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x222225, roughness: 0.8 });
            road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            road.position.z = -450;
            scene.add(road);

            // Road Lines
            for (let i = 0; i < 50; i++) {
                const lineGeo = new THREE.PlaneGeometry(0.3, 4);
                const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                const line = new THREE.Mesh(lineGeo, lineMat);
                line.rotation.x = -Math.PI / 2;
                line.position.set(0, 0.01, -i * 20);
                scene.add(line);
            }

            // 5. Create Player Car
            playerCar = createCar(0x00ffcc);
            playerCar.position.set(0, 0, 0);
            scene.add(playerCar);

            // 6. Spawn Initial Enemy Cars
            for (let i = 0; i < 5; i++) {
                spawnEnemyCar(-50 - i * 40);
            }

            // Event Listeners
            window.addEventListener('keydown', e => { if (keys.hasOwnProperty(e.key)) keys[e.key] = true; });
            window.addEventListener('keyup', e => { if (keys.hasOwnProperty(e.key)) keys[e.key] = false; });
            window.addEventListener('resize', onWindowResize);

            animate();
        }

        // Car Mesh Generator
        function createCar(colorHex) {
            const carGroup = new THREE.Group();

            // Car Body
            const bodyGeo = new THREE.BoxGeometry(1.6, 0.7, 3.2);
            const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex, metalness: 0.5, roughness: 0.2 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.5;
            carGroup.add(body);

            // Cabin / Roof
            const cabinGeo = new THREE.BoxGeometry(1.2, 0.5, 1.6);
            const cabinMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9, roughness: 0.1 });
            const cabin = new THREE.Mesh(cabinGeo, cabinMat);
            cabin.position.set(0, 1.0, -0.2);
            carGroup.add(cabin);

            // Headlights
            const lightGeo = new THREE.BoxGeometry(0.3, 0.15, 0.1);
            const lightMat = new THREE.MeshBasicMaterial({ color: 0xffffaa });
            const leftLight = new THREE.Mesh(lightGeo, lightMat);
            leftLight.position.set(-0.6, 0.5, -1.61);
            const rightLight = new THREE.Mesh(lightGeo, lightMat);
            rightLight.position.set(0.6, 0.5, -1.61);
            carGroup.add(leftLight);
            carGroup.add(rightLight);

            return carGroup;
        }

        function spawnEnemyCar(zPos) {
            const colors = [0xff0055, 0xffaa00, 0x9900ff, 0x0099ff];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            const enemy = createCar(randomColor);
            
            const lanes = [-3.8, -1.3, 1.3, 3.8];
            const randomLane = lanes[Math.floor(Math.random() * lanes.length)];
            
            enemy.position.set(randomLane, 0, zPos);
            scene.add(enemy);
            enemyCars.push(enemy);
        }

        function animate() {
            if (isGameOver) return;

            requestAnimationFrame(animate);

            // Controls logic
            if (keys.ArrowUp) {
                speed = Math.min(speed + acceleration, maxSpeed);
            } else if (keys.ArrowDown) {
                speed = Math.max(speed - acceleration * 1.5, 0);
            } else {
                speed = Math.max(speed - deceleration, 0.2); // Cruise speed
            }

            if (keys.ArrowLeft && playerCar.position.x > -4.5) {
                playerCar.position.x -= 0.12;
                playerCar.rotation.y = 0.1;
            } else if (keys.ArrowRight && playerCar.position.x < 4.5) {
                playerCar.position.x += 0.12;
                playerCar.rotation.y = -0.1;
            } else {
                playerCar.rotation.y = 0;
            }

            // Move Enemy Cars & Check Collision
            for (let i = 0; i < enemyCars.length; i++) {
                let enemy = enemyCars[i];
                enemy.position.z += speed * 2; // Moves towards player

                // Reset position when passed
                if (enemy.position.z > 10) {
                    enemy.position.z = -180 - Math.random() * 50;
                    const lanes = [-3.8, -1.3, 1.3, 3.8];
                    enemy.position.x = lanes[Math.floor(Math.random() * lanes.length)];
                    score += 10;
                }

                // Collision Detection (Box Bounding)
                let dx = Math.abs(playerCar.position.x - enemy.position.x);
                let dz = Math.abs(playerCar.position.z - enemy.position.z);
                if (dx < 1.4 && dz < 2.8) {
                    endGame();
                }
            }

            // UI Update
            score += Math.floor(speed * 2);
            document.getElementById('speed-val').innerText = Math.floor(speed * 120);
            document.getElementById('score-val').innerText = score;

            // Camera follow smoothly
            camera.position.x = playerCar.position.x * 0.3;

            renderer.render(scene, camera);
        }

        function endGame() {
            isGameOver = true;
            document.getElementById('final-score').innerText = score;
            document.getElementById('game-over').style.display = 'block';
        }

        function resetGame() {
            isGameOver = false;
            speed = 0;
            score = 0;
            playerCar.position.set(0, 0, 0);
            
            // Reset enemies
            for (let i = 0; i < enemyCars.length; i++) {
                enemyCars[i].position.z = -50 - i * 40;
            }

            document.getElementById('game-over').style.display = 'none';
            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Run Engine
        init();
    </script>
</body>
</html>
