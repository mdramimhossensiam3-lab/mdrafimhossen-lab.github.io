<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Photo Studio & Generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 {
            font-size: 2.2rem;
            color: #38bdf8;
            margin-bottom: 8px;
        }
        header p {
            color: #94a3b8;
            font-size: 1rem;
        }
        .container {
            background: #1e293b;
            width: 100%;
            max-width: 900px;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
        .input-section, .output-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        label {
            font-weight: 600;
            font-size: 0.9rem;
            color: #cbd5e1;
        }
        input[type="text"], input[type="password"], textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        input[type="file"] {
            display: none;
        }
        .upload-btn {
            background: #334155;
            color: #e2e8f0;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            border: 1px dashed #64748b;
            transition: 0.3s;
        }
        .upload-btn:hover {
            background: #475569;
        }
        .btn-submit {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-submit:hover {
            opacity: 0.9;
        }
        .preview-box {
            width: 100%;
            height: 250px;
            background: #0f172a;
            border-radius: 8px;
            border: 1px solid #334155;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        .preview-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .placeholder-text {
            color: #64748b;
            font-size: 0.9rem;
        }
        .btn-download {
            background: #16a34a;
            color: white;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            text-align: center;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>AI Photo Studio</h1>
        <p>ছবি আপলোড করুন এবং বিবরণ লিখে নতুন AI ছবি তৈরি করুন</p>
    </header>

    <div class="container">
        <!-- Input Section -->
        <div class="input-section">
            <div class="form-group">
                <label for="apiKey">OpenAI API Key:</label>
                <input type="password" id="apiKey" placeholder="sk-...">
            </div>

            <div class="form-group">
                <label>আপনার মূল ছবি আপলোড করুন:</label>
                <label for="fileUpload" class="upload-btn" id="uploadLabel">📷 ছবি নির্বাচন করুন</label>
                <input type="file" id="fileUpload" accept="image/*" onchange="previewSourceImage(event)">
            </div>

            <div class="form-group">
                <label for="prompt">ছবিতে কী পরিবর্তন বা কেমন ছবি চান? (English Prompt):</label>
                <textarea id="prompt" placeholder="Example: A high quality photo of a young man, professional portrait, 8k resolution..."></textarea>
            </div>

            <button class="btn-submit" onclick="generateAIImage()">✨ AI ছবি জেনারেট করুন</button>
        </div>

        <!-- Output Section -->
        <div class="output-section">
            <label>আপলোড করা ছবি:</label>
            <div class="preview-box">
                <span class="placeholder-text" id="srcPlaceholder">কোনো ছবি আপলোড করা হয়নি</span>
                <img id="sourcePreview" style="display:none;">
            </div>

            <label>AI দ্বারা তৈরি নতুন ছবি:</label>
            <div class="preview-box">
                <span class="placeholder-text" id="resultPlaceholder">জেনারেট করা ছবি এখানে দেখাবে</span>
                <img id="resultImage" style="display:none;">
            </div>

            <a id="downloadBtn" class="btn-download" target="_blank" download="ai-generated-image.png">📥 ছবি ডাউনলোড করুন</a>
        </div>
    </div>

    <script>
        function previewSourceImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById('sourcePreview');
                    img.src = e.target.result;
                    img.style.display = 'block';
                    document.getElementById('srcPlaceholder').style.display = 'none';
                    document.getElementById('uploadLabel').innerText = "✓ " + file.name;
                }
                reader.readAsDataURL(file);
            }
        }

        async function generateAIImage() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const promptText = document.getElementById('prompt').value.trim();
            const resultImg = document.getElementById('resultImage');
            const resultPlaceholder = document.getElementById('resultPlaceholder');
            const downloadBtn = document.getElementById('downloadBtn');

            if (!apiKey) {
                alert("দয়া করে আপনার OpenAI API Key লিখুন!");
                return;
            }

            if (!promptText) {
                alert("ছবি সম্পর্কে বিবরণ (Prompt) লিখুন!");
                return;
            }

            resultPlaceholder.style.display = 'block';
            resultPlaceholder.innerText = "AI ছবি জেনারেট হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...";
            resultImg.style.display = 'none';
            downloadBtn.style.display = 'none';

            try {
                // OpenAI DALL-E 2 API Call
                const response = await fetch('https://api.openai.com/v1/images/generations', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "dall-e-2",
                        prompt: promptText,
                        n: 1,
                        size: "512x512"
                    })
                });

                const data = await response.json();

                if (response.ok && data.data && data.data.length > 0) {
                    const imageUrl = data.data[0].url;
                    resultImg.src = imageUrl;
                    resultImg.style.display = 'block';
                    resultPlaceholder.style.display = 'none';

                    downloadBtn.href = imageUrl;
                    downloadBtn.style.display = 'block';
                } else {
                    alert("ত্রুটি: " + (data.error ? data.error.message : "ছবি তৈরি করা যায়নি।"));
                    resultPlaceholder.innerText = "ছবি জেনারেট ব্যর্থ হয়েছে।";
                }
            } catch (error) {
                console.error(error);
                alert("নেটওয়ার্ক সমস্যা বা এরর হয়েছে।");
                resultPlaceholder.innerText = "ত্রুটি ঘটেছে।";
            }
        }
    </script>
</body>
</html>
